[package]
name = "abot"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/djkcyl/abot-rs"
description = "用 nagisa 搭的多插件 QQ 机器人"

[dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.102"
arc-swap = "1.9.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.32"
gif = "0.14.2"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.5", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
md5 = "0.7.0"
nagisa = { version = "0.7", default-features = false, features = ["log", "onebot", "render"] }
rand = "0.10.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rqrr = "0.10.1"
rust-embed = { version = "8", features = ["mime-guess"] }
schemars = "1.2.1"
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# 开发期:把 nagisa 指到本地工作树以联调框架改动。发布/合并前撤回本段并改回 crates.io 版。
[patch.crates-io]
nagisa = { path = "../nagi/crates/nagisa" }
