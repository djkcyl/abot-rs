[package]
name = "abot"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/djkcyl/abot-rs"
description = "用 nagisa 搭的多插件 QQ 机器人"

[dependencies]
anyhow = "1.0.102"
ar-reshaper = "1.5.0"
arc-swap = "1.9.1"
async-trait = "0.1.89"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.32"
gif = "0.14.2"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.5", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
md5 = "0.7.0"
nagisa = { version = "0.11", default-features = false, features = ["log", "onebot", "render"] }
rand = "0.10.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rust-embed = { version = "8", features = ["mime-guess"] }
schemars = "1.2.1"
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tract-onnx = "0.23.1"
unicode-bidi = "0.3.18"

# 开发期:把 nagisa 指到本地工作树以联调框架改动。发布/合并前撤回本段并改回 crates.io 版。
[patch.crates-io]
nagisa = { path = "../nagi/crates/nagisa" }

# dev 下依赖一律 O3:出图热路径(parley 整形/swash 栅格/WebP 编码/zstd 解字体)全在
# 依赖里,这样 dev 构建的渲染速度即接近 release;abot 自身仍 O0,增量编译保持秒级。
# 代价:依赖首次全量构建变慢(一次性),以及本地 patch 的 nagisa 改动后重编也走 O3。
# debug = false 关掉第三方依赖的 debuginfo(产物体积/堆积速度大减,编译更快):机器码
# 不变,panic 位置字符串仍在,只是 backtrace 里第三方帧没有文件行号、调试器进不去其源码。
[profile.dev.package."*"]
opt-level = 3
debug = false

# 自家框架例外:联调 nagisa 时 backtrace 要能落到框架源码行号。opt-level 显式重申
# (按包覆写不继承 "*" 段,漏写会落回 dev 默认 O0,render 速度就没了)。
[profile.dev.package.nagisa]
opt-level = 3
debug = true
[profile.dev.package.nagisa-core]
opt-level = 3
debug = true
[profile.dev.package.nagisa-types]
opt-level = 3
debug = true
[profile.dev.package.nagisa-onebot]
opt-level = 3
debug = true
[profile.dev.package.nagisa-milky]
opt-level = 3
debug = true
[profile.dev.package.nagisa-log]
opt-level = 3
debug = true
[profile.dev.package.nagisa-render]
opt-level = 3
debug = true
